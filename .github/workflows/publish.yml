on:
  push:
    branches: [master]

name: Quarto Publish

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install knitr (parse-only; no analysis packages needed)
        run: |
          install.packages(c("knitr", "rmarkdown"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Render Quarto Project
        # --no-execute: rely on the committed _freeze/ cache. Knitr is still
        # invoked to parse .qmd files, but no chunks execute. Code-cell
        # changes must be rendered locally and freeze cache committed.
        run: quarto render --no-execute

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
