project:
  type: book

book:
  title: "Introduction to Causal Econometrics with Observational Data"
  author: "Xiang Ao, HBS"
  date: "last-modified"
  search: true
  reader-mode: true
  page-navigation: true
  site-url: https://xiangao.github.io/causal_econometrics_guide/
  repo-url: https://github.com/xiangao/causal_econometrics_guide/
  repo-actions: [edit, issue]
  sidebar:
    tools:
      - icon: house-door-fill
        text: Xiang Ao home
        href: https://xiangao.github.io/
      - icon: github
        href: https://github.com/xiangao/causal_econometrics_guide
  chapters:
    - index.qmd
    - part: "Identification"
      chapters:
        - identification.qmd
        - causal-estimands.qmd
        - graphs-identification-estimation.qmd
        - smoking-cessation-graphs.qmd
        - sensitivity-analysis.qmd
    - part: "Estimation"
      chapters:
        - estimation.qmd
        - matching.qmd
        - nonparametric.qmd
        - heterogeneous-effects.qmd
        - continuous-treatments.qmd
        - bayesian-causal.qmd
    - part: "Designs"
      chapters:
        - did.qmd
        - iv-rdd.qmd
        - shift-share-iv.qmd
        - poisson-iv.qmd
    - part: "Longitudinal Causal Inference"
      chapters:
        - g-methods.qmd
    - part: "Survival & Time-to-Event"
      chapters:
        - survival-causal.qmd
    - part: "Mediation"
      chapters:
        - mediation.qmd
    - part: "Causal Discovery"
      chapters:
        - causal-discovery.qmd
        - causal-discovery-latent.qmd
        - graph-to-estimate.qmd
    - part: "Appendix"
      chapters:
        - package-ecosystem.qmd

format:
  html:
    theme:
      light: cosmo
    css: style.css
    code-link: true
    callout-appearance: simple
    code-tools: true

execute:
  freeze: auto
  warning: false
  message: false
